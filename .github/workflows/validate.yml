name: Smoke validate all 100 projects

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke_validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install shared validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Seed real AAPL reference data for the isolated runner
        run: |
          mkdir -p "02 - Supervised Learning Projects (Days 11-20)/Project 011 - Predict Stock Prices with LSTM/data"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/plotly/datasets/master/finance-charts-apple.csv \
            --output "02 - Supervised Learning Projects (Days 11-20)/Project 011 - Predict Stock Prices with LSTM/data/AAPL.csv"
      - name: Run dependency-light smoke validation for every project
        run: python validate_all.py
